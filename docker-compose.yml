# Development stack: builds from the Dockerfile in this repo.
# For the published image, copy the compose snippet in README.md (or docs/deployment.md).
#
# Create ./custom_ports.json as a file before the first `up` if you keep the
# bind mount below — a missing path becomes a directory and the app cannot read it.
# NET_ADMIN is unused in the usual bridge + /host/proc setup.

services:
  port-light:
    build: .
    container_name: port-light
    restart: unless-stopped
    ports:
      - "2100:2100"
    volumes:
      # Directory of compose projects (one level of subfolders is scanned)
      - ${COMPOSE_SCAN_DIR:-~/your-compose-dir}:/compose:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host PID 1 network namespace: /host/proc/1/net/tcp
      - /proc:/host/proc:ro
      - ./data:/data
      - ${CUSTOM_PORTS_FILE:-./custom_ports.json}:/data/custom_ports.json:ro
    environment:
      - COMPOSE_SCAN_DIR=/compose
      - COMPOSE_SCAN_DEPTH=${COMPOSE_SCAN_DEPTH:-4}
      - COMPOSE_SCAN_MAX_FILES=${COMPOSE_SCAN_MAX_FILES:-400}
      - PORT_RANGE_START=${PORT_RANGE_START:-1}
      - PORT_RANGE_END=${PORT_RANGE_END:-9999}
      - PORT_LIGHT_DATA_DIR=/data
      - CUSTOM_PORTS_FILE=/data/custom_ports.json
      # - AUTH_USER=admin
      # - AUTH_PASSWORD=change-me
      # - HIDDEN_UNLOCK_PASSWORD=change-me-too
      # - URL_HOST=nas.lan
      # - PORT_LIGHT_SETTINGS_SOURCE=auto
      # - PORT_LIGHT_HOST_NAME=Studio
      # - PORT_LIGHT_PEERS=[{"name":"NAS","url":"http://10.0.0.2:2100"}]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2100/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Uncomment only if you rely on `ss -tlnp` process names (bare metal / host net).
    # cap_add:
    #   - NET_ADMIN
