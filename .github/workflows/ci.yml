name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Record dependency versions
        run: pip freeze
      - name: Lint
        run: ruff check backend tests mcp
      - name: Test
        run: |
          set -o pipefail
          python -m pytest --tb=short -ra 2>&1 | tee pytest.log
      - name: Report failures
        if: failure()
        run: |
          awk '/=+ short test summary info =+/,0' pytest.log | head -30 | sed 's/^/::error::/'
          tail -8 pytest.log | sed 's/^/::error::/'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test frontend modules
        run: node --test "frontend/test/**/*.test.mjs"
