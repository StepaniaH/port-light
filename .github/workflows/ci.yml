name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Record dependency versions
        run: pip freeze
      - name: Lint
        if: matrix.python-version == '3.13'
        run: ruff check backend tests mcp port_light_client scripts/check_release_ci.py scripts/dev.py scripts/dockerhub_description.py
      - name: Build CLI wheel
        if: matrix.python-version == '3.13'
        run: |
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/port-light-cli-smoke"
          "$RUNNER_TEMP/port-light-cli-smoke/bin/pip" install --no-index dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/port-light-cli-smoke/bin/port-light" --version
      - name: Test
        run: |
          set -o pipefail
          python -m pytest --tb=long -ra 2>&1 | tee pytest.log
      - name: Report failures
        if: failure()
        run: |
          {
            echo '```'
            awk '/=+ FAILURES =+/,/=+ short test summary info =+/' pytest.log | head -80
            tail -6 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test frontend modules
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm test
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Browser smoke
        run: |
          pip install -r requirements.txt
          npx playwright install --with-deps chromium
          npm run smoke:browser
          npm run smoke:management

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t port-light:ci .
      - name: Smoke CLI and MCP entry points
        run: |
          docker run --rm --entrypoint port-light port-light:ci --version
          docker run --rm --entrypoint python port-light:ci mcp/server.py
