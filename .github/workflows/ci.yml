name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Record dependency versions
        run: pip freeze
      - name: Lint
        run: ruff check backend tests mcp
      - name: Test
        run: |
          set -o pipefail
          python -m pytest --tb=long -ra 2>&1 | tee pytest.log
      - name: Report failures
        if: failure()
        run: |
          {
            echo '```'
            awk '/=+ FAILURES =+/,/=+ short test summary info =+/' pytest.log | head -80
            tail -6 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Archive raw log for diagnosis
        if: failure()
        run: |
          git config user.name "ci-diag"
          git config user.email "ci-diag@users.noreply.github.com"
          git checkout -B ci-log
          git add -f pytest.log
          git commit -m "pytest log from run $GITHUB_RUN_ID (py${{ matrix.python-version }})"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log --force

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test frontend modules
        run: node --test "frontend/test/**/*.test.mjs"
