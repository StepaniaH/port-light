name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit
        id: source
        run: |
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for main CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/check_release_ci.py "$GITHUB_REPOSITORY" "$RELEASE_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build matching CLI wheel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import ast, os, pathlib
          version = os.environ["TAG"].removeprefix("v")
          client_tree = ast.parse(pathlib.Path("port_light_client/__init__.py").read_text(encoding="utf-8"))
          client_version = next(
              ast.literal_eval(node.value)
              for node in client_tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__"
                      for target in node.targets)
          )
          if client_version != version:
              raise SystemExit(f"tag {version} and product version {client_version} must match")
          PY
          python -m pip install "build>=1.6.1"
          python -m build --wheel

      - name: Verify built CLI wheel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m venv "$RUNNER_TEMP/port-light-cli-smoke"
          "$RUNNER_TEMP/port-light-cli-smoke/bin/python" -m pip install --no-index dist/*.whl
          cd "$RUNNER_TEMP"
          version_out="$("$RUNNER_TEMP/port-light-cli-smoke/bin/port-light" --version)"
          echo "$version_out"
          expected="${TAG#v}"
          case "$version_out" in
            *"$expected"*) ;;
            *) echo "unexpected port-light --version output: $version_out (expected $expected)" >&2; exit 1 ;;
          esac
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"release-smoke","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | "$RUNNER_TEMP/port-light-cli-smoke/bin/port-light-mcp" > "$RUNNER_TEMP/mcp-release-smoke.jsonl"
          python3 - <<'PY'
          import json, os, pathlib
          rows = [
              json.loads(line)
              for line in pathlib.Path(os.environ["RUNNER_TEMP"], "mcp-release-smoke.jsonl")
              .read_text(encoding="utf-8")
              .splitlines()
          ]
          assert [r["id"] for r in rows] == [1, 2], rows
          assert rows[0]["result"]["protocolVersion"] == "2025-11-25", rows[0]
          assert {"doctor", "reserve_ports", "release_port"} <= {t["name"] for t in rows[1]["result"]["tools"]}, rows[1]
          PY
          python3 "$GITHUB_WORKSPACE/scripts/check_ai_install.py" "$RUNNER_TEMP/port-light-cli-smoke/bin/python" "$GITHUB_WORKSPACE"/dist/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: port-light-cli-wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Verify CHANGELOG section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ["TAG"]
          version = tag.removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## {re.escape(version)}(?=\s|$).*?(?=^## |\Z)", text, re.M | re.S)
          if not m:
              raise SystemExit(f"CHANGELOG.md is missing a '## {version}' section for tag {tag}")
          PY

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          owner="${REPOSITORY_OWNER,,}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tags=stepaniah/port-light:${TAG},stepaniah/port-light:latest,ghcr.io/${owner}/port-light:${TAG},ghcr.io/${owner}/port-light:latest" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tags=stepaniah/port-light:${TAG},ghcr.io/${owner}/port-light:${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-and-push.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: port-light-cli-wheel
          path: dist

      - name: Notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ["TAG"]
          version = tag.removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## {re.escape(version)}(?=\s|$).*?(?=^## |\Z)", text, re.M | re.S)
          if not m:
              raise SystemExit(f"CHANGELOG.md is missing a '## {version}' section for tag {tag}")
          notes = m.group(0).strip()
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          prerelease: ${{ needs.build-and-push.outputs.prerelease == 'true' }}
          files: dist/*.whl

  dockerhub-description:
    needs: [build-and-push, github-release]
    if: ${{ success() && needs.build-and-push.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-and-push.outputs.sha }}
          persist-credentials: false
      - name: Update Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/dockerhub_description.py --ref "$RELEASE_TAG" --publish
