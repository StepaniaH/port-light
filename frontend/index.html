<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Port-Light</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="apple-touch-icon" href="/static/icon.png">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('port-light-settings') || '{}');
      var m = s.theme_mode === 'light' || s.theme_mode === 'dark'
        ? s.theme_mode
        : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-mode', m);
      var PAL = {gruvbox:['dark','light'],catppuccin:['dark','light'],solarized:['dark','light'],nord:['dark'],dracula:['dark'],'tokyo-night':['dark'],'one-dark':['dark'],everforest:['dark'],'rose-pine':['dark'],kanagawa:['dark']};
      if (typeof s.theme_palette === 'string' && s.theme_palette && PAL[s.theme_palette] && PAL[s.theme_palette].indexOf(m) >= 0) {
        document.documentElement.setAttribute('data-palette', s.theme_palette);
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/style.css?v=67">
</head>
<body>
  <a class="skip-link" href="#grid" data-i18n="grid.skip">Skip to ports</a>
  <div id="app">
    <header class="app-header" id="app-header">
      <div class="app-bar">
        <a class="brand" href="#/" id="brand-link">
          <img class="brand-icon" src="/static/icon.png" width="32" height="32" alt="">
          <span class="brand-text">
            <span class="brand-name">Port-Light</span>
            <span class="brand-sub" id="app-version"></span>
          </span>
        </a>
        <div class="app-search" id="app-search">
          <input type="search" id="search" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria">
        </div>
        <div class="app-actions">
          <div id="scanner-pills" class="scanner-dots" data-i18n-aria="scanner.label"></div>
          <span id="sync-error" class="sync-error hidden" hidden role="status" aria-live="polite"></span>
          <time id="sync-age" class="sync-age" hidden></time>
          <button type="button" id="btn-refresh" class="icon-btn" data-i18n-title="action.refresh">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
              <path d="M13.2 8A5.2 5.2 0 1 1 8 2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M13.25 2.4v3.1H10.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button type="button" id="btn-add" class="icon-btn" data-i18n-title="action.add">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 1.5a.75.75 0 0 1 .75.75v5h5a.75.75 0 0 1 0 1.5h-5v5a.75.75 0 0 1-1.5 0v-5h-5a.75.75 0 0 1 0-1.5h5v-5A.75.75 0 0 1 8 1.5z"/></svg>
          </button>
          <button type="button" id="btn-free" class="icon-btn" data-i18n-title="action.findFree">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M11.5 2a3.5 3.5 0 0 0-3.4 4.4L2.3 12.2a1 1 0 0 0 0 1.4l.1.1a1 1 0 0 0 1.4 0l5.8-5.8A3.5 3.5 0 1 0 11.5 2zm0 5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
          </button>
          <button type="button" id="btn-unhide" class="icon-btn" data-i18n-title="action.showHidden" aria-pressed="false">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 3c-3.2 0-5.9 2.1-7.2 5 1.3 2.9 4 5 7.2 5s5.9-2.1 7.2-5C13.9 5.1 11.2 3 8 3zm0 8.2A3.2 3.2 0 1 1 8 4.8a3.2 3.2 0 0 1 0 6.4zM8 6.1a1.9 1.9 0 1 0 0 3.8 1.9 1.9 0 0 0 0-3.8z"/></svg>
          </button>
          <a href="#/settings" id="btn-settings" class="icon-btn" data-nav="settings" data-i18n-title="action.settings">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm5.87-2.13.9.52a.75.75 0 0 1 .28 1.02l-.7 1.21a.75.75 0 0 1-.95.32l-1.04-.4a5.03 5.03 0 0 1-1.13.65l-.16 1.1A.75.75 0 0 1 9.32 14H6.68a.75.75 0 0 1-.74-.64l-.16-1.1a5.03 5.03 0 0 1-1.13-.65l-1.04.4a.75.75 0 0 1-.95-.32l-.7-1.21a.75.75 0 0 1 .28-1.02l.9-.52a5.1 5.1 0 0 1 0-1.74l-.9-.52a.75.75 0 0 1-.28-1.02l.7-1.21a.75.75 0 0 1 .95-.32l1.04.4c.35-.27.73-.5 1.13-.65l.16-1.1A.75.75 0 0 1 6.68 2h2.64a.75.75 0 0 1 .74.64l.16 1.1c.4.15.78.38 1.13.65l1.04-.4a.75.75 0 0 1 .95.32l.7 1.21a.75.75 0 0 1-.28 1.02l-.9.52c.08.57.08 1.17 0 1.74z"/></svg>
          </a>
        </div>
      </div>
      <div class="context-bar" id="context-bar">
        <div id="summary" class="legend" role="group" data-i18n-aria="legend.occupancy"></div>
        <div id="filters" class="filter-chips" role="group" data-i18n-aria="filter.kinds">
          <button type="button" class="chip" data-filter="running" aria-pressed="false" data-i18n="filter.running">Running</button>
          <button type="button" class="chip" data-filter="system" aria-pressed="false" data-i18n="filter.system">System</button>
          <button type="button" class="chip" data-filter="docker" aria-pressed="false" data-i18n="filter.docker">Docker</button>
          <button type="button" class="chip" data-filter="access" aria-pressed="false" data-i18n="filter.access">Web</button>
          <button type="button" class="chip" data-filter="udp" aria-pressed="false" data-i18n="filter.udp">UDP</button>
          <button type="button" class="chip" data-filter="localhost" aria-pressed="false" data-i18n="filter.localhost">localhost</button>
          <button type="button" class="chip" data-filter="public" aria-pressed="false" data-i18n="filter.public">Public</button>
          <button type="button" class="chip" data-filter="hidden" aria-pressed="false" data-i18n="filter.hidden">Hidden</button>
        </div>
        <div class="filter-aside">
          <label class="quiet-field">
            <span data-i18n="filter.sort">Sort</span>
            <select id="sort-select" class="dropdown">
              <option value="port-asc" data-i18n="filter.portAsc">Port ↑</option>
              <option value="port-desc" data-i18n="filter.portDesc">Port ↓</option>
              <option value="name-asc" data-i18n="filter.nameAsc">Name A–Z</option>
              <option value="name-desc" data-i18n="filter.nameDesc">Name Z–A</option>
              <option value="status" data-i18n="filter.byStatus">Status</option>
            </select>
          </label>
          <label class="quiet-field">
            <span data-i18n="filter.range">Range</span>
            <span class="range-group">
              <input type="number" id="range-start" value="1" min="1" max="65535" class="range-input" data-i18n-aria="filter.rangeStart">
              <span class="range-sep">–</span>
              <input type="number" id="range-end" value="9999" min="1" max="65535" class="range-input" data-i18n-aria="filter.rangeEnd">
            </span>
          </label>
        </div>
      </div>
    </header>

    <section id="view-grid" class="view">
      <div id="host-switcher" class="host-switcher hidden" hidden role="tablist" data-i18n-aria="hosts.switcher"></div>
      <div id="grid" tabindex="-1" role="region" data-i18n-aria="grid.aria"></div>
      <div id="host-boards" class="host-boards hidden" hidden></div>
    </section>

    <section id="view-settings" class="view hidden">
      <form id="settings-form" class="settings-page" autocomplete="off" tabindex="-1">
        <div class="page-intro">
          <h1 data-i18n="settings.title">Settings</h1>
          <p class="settings-lead" id="settings-lead"></p>
        </div>
        <nav id="settings-nav" class="settings-nav" role="tablist" data-i18n-aria="settings.nav.label">
          <button type="button" role="tab" id="settings-tab-appearance" data-settings-panel="appearance" aria-controls="settings-panel-appearance" aria-selected="true" tabindex="0" data-i18n="settings.nav.appearance">Appearance</button>
          <button type="button" role="tab" id="settings-tab-occupancy" data-settings-panel="occupancy" aria-controls="settings-panel-occupancy" aria-selected="false" tabindex="-1" data-i18n="settings.nav.occupancy">Occupancy</button>
          <button type="button" role="tab" id="settings-tab-automation" data-settings-panel="automation" aria-controls="settings-panel-automation" aria-selected="false" tabindex="-1" data-i18n="settings.nav.automation">Automation</button>
          <button type="button" role="tab" id="settings-tab-advanced" data-settings-panel="advanced" aria-controls="settings-panel-advanced" aria-selected="false" tabindex="-1" data-i18n="settings.nav.advanced">Advanced</button>
        </nav>
        <div id="settings-fields"></div>
        <div class="settings-footer">
          <span id="settings-status"></span>
          <button type="submit" class="btn-primary" id="settings-save" data-i18n="settings.save">Save</button>
        </div>
      </form>
    </section>

    <div id="detail-backdrop" class="hidden"></div>
    <aside id="detail-panel" class="hidden" data-i18n-aria="detail.panel">
      <div id="detail-content"></div>
    </aside>

    <div id="add-modal" class="modal hidden" role="dialog" aria-labelledby="add-title" aria-modal="true">
      <form class="modal-content" id="add-form">
        <h2 id="add-title" data-i18n="modal.addTitle">Add port</h2>
        <label><span data-i18n="modal.portNumber">Port number</span>
          <input type="number" id="add-port" min="1" max="65535" placeholder="8000" required>
        </label>
        <label><span data-i18n="modal.label">Label</span>
          <input type="text" id="add-label" maxlength="80" data-i18n-placeholder="modal.optional">
        </label>
        <p id="add-error" class="modal-hint is-error hidden" hidden role="alert"></p>
        <div class="modal-actions">
          <button type="button" id="add-cancel" class="btn-secondary" data-i18n="modal.cancel">Cancel</button>
          <button type="submit" id="add-confirm" class="btn-primary" data-i18n="modal.add">Add</button>
        </div>
      </form>
    </div>

    <div id="free-modal" class="modal hidden" role="dialog" aria-labelledby="free-title" aria-modal="true">
      <form class="modal-content" id="free-form">
        <h2 id="free-title" data-i18n="planner.title">Find free ports</h2>
        <label><span data-i18n="planner.count">How many ports do you need?</span>
          <input type="number" id="free-count" min="1" max="64" value="1" required>
        </label>
        <label><span data-i18n="planner.label">Label for reservation</span>
          <input type="text" id="free-label" maxlength="80" data-i18n-placeholder="modal.optional">
        </label>
        <div id="free-results" class="free-results" hidden></div>
        <p id="free-error" class="modal-hint is-error hidden" hidden role="alert"></p>
        <div class="modal-actions">
          <button type="button" id="free-cancel" class="btn-secondary" data-i18n="modal.cancel">Cancel</button>
          <button type="submit" id="free-find" class="btn-primary" data-i18n="planner.find">Find runs</button>
        </div>
      </form>
    </div>

    <div id="unhide-modal" class="modal hidden" role="dialog" aria-labelledby="unhide-title" aria-modal="true">
      <form class="modal-content" id="unhide-form">
        <h2 id="unhide-title" data-i18n="modal.unhideTitle">Show hidden ports</h2>
        <p class="modal-hint" data-i18n="modal.unhideHint">Enter the unlock password if the host requires one. Otherwise the eye button just includes hidden ports in the grid.</p>
        <label><span data-i18n="modal.unlockPassword">Unlock password</span>
          <input type="password" id="unhide-password" autocomplete="current-password" required>
        </label>
        <p id="unhide-error" class="modal-hint is-error hidden" hidden role="alert"></p>
        <div class="modal-actions">
          <button type="button" id="unhide-cancel" class="btn-secondary" data-i18n="modal.cancel">Cancel</button>
          <button type="submit" id="unhide-confirm" class="btn-primary" data-i18n="modal.unlock">Unlock</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/i18n.js?v=67"></script>
  <script type="module" src="/static/js/app.js?v=67"></script>
</body>
</html>
